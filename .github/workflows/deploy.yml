name: CI/CD Pipeline - Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # 1. Validate that secret is configured without printing its content
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not configured or is empty. Please set it in repository secrets."
            exit 1
          fi

          echo "Initiating deployment trigger to Render via secure deployment hook..."

          # 2. Trigger webhook using POST with failure handling (fails step on HTTP 4xx/5xx)
          curl -X POST --fail --silent --show-error "$RENDER_DEPLOY_HOOK"

          echo "Deployment hook triggered successfully."
          echo "NOTE: A successful webhook trigger request indicates Render has received the build instruction;"
          echo "it does not signify that the remote container build or rollout has completed."
          echo "Monitor progress and logs at https://dashboard.render.com"
